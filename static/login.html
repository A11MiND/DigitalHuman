<!DOCTYPE html>
<html lang="zh-Hant" data-locale="zh-Hant" data-title-key="brand">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>數字人殿堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22%23FFD60A%22/><path d=%22M26 30h48a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H48L32 80V68h-6a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z%22 fill=%22%23101012%22/><circle cx=%2240%22 cy=%2249%22 r=%224.5%22 fill=%22%23FFD60A%22/><circle cx=%2256%22 cy=%2249%22 r=%224.5%22 fill=%22%23FFD60A%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/palace.css">
<script src="/js/i18n.js"></script>
<style>
  /* ── Sign-in dialog ─────────────────────────────────────────── */
  .modal-back {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(16,24,40,.34);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-back.open { display: flex; }

  .login-card {
    position: relative;
    width: min(432px, 100%);
    max-height: 92vh;
    overflow: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 30px 30px 26px;
    box-shadow: 0 40px 90px -30px rgba(16,24,40,.45);
  }

  .login-close {
    position: absolute;
    top: 16px; right: 16px;
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    font-size: 21px;
    line-height: 1;
    cursor: pointer;
  }
  .login-close:hover { background: #F5F6F8; }

  .login-head { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .login-head .brand-mark { width: 40px; height: 40px; }
  .login-head h2 { font-size: 21px; font-weight: 800; letter-spacing: -0.015em; }
  .login-head p { font-size: 12px; font-weight: 600; color: var(--muted-2); letter-spacing: .08em; margin-top: 2px; }

  .msg {
    display: none;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 16px;
  }
  .msg.show { display: block; }
  .msg.error { background: #FDECEB; color: #B3261E; }
  .msg.ok { background: #EAF6EC; color: #2E6B36; }

  .lf-field { margin-bottom: 15px; }
  .lf-field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .lf-field input {
    width: 100%;
    border: 1px solid var(--line);
    background: #FCFDFD;
    border-radius: 11px;
    color: var(--ink);
    padding: 13px 14px;
    font: 15px/1.4 var(--font-sans);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .lf-field input:focus {
    border-color: var(--yellow-deep);
    box-shadow: 0 0 0 3px rgba(255,214,10,.28);
    background: #fff;
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 46px; }
  .pw-toggle {
    position: absolute;
    top: 50%; right: 8px;
    transform: translateY(-50%);
    width: 32px; height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    font-size: 15px;
    line-height: 1;
  }
  .pw-toggle:hover { background: #F2F4F6; }

  .btn-submit {
    width: 100%;
    height: 50px;
    margin-top: 6px;
    border: 0;
    border-radius: 12px;
    background: var(--yellow);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background .18s ease;
  }
  .btn-submit:hover { background: var(--yellow-deep); }
  .btn-submit:disabled { opacity: .62; cursor: progress; }
  .spin {
    width: 15px; height: 15px;
    border: 2px solid rgba(16,16,18,.25);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .login-foot { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-2); }
  .login-foot > p { font-size: 12.5px; line-height: 1.55; color: var(--muted); }
  .tiers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .tier { padding: 11px 13px; border-radius: 11px; background: #F6F7F9; }
  .tier.premium { background: var(--yellow-soft); }
  .tier .t-name { font-size: 13px; font-weight: 700; }
  .tier .t-desc { font-size: 11.5px; color: var(--muted); margin-top: 3px; line-height: 1.4; }

  @media (max-width: 420px) {
    .login-card { padding: 26px 20px 22px; }
    .tiers { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="shell">

  <header class="site-header">
    <a class="brand" href="/login.html">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4.6 4.9h14.8a2 2 0 0 1 2 2v7.6a2 2 0 0 1-2 2h-7.1l-4.6 3.9v-3.9H4.6a2 2 0 0 1-2-2V6.9a2 2 0 0 1 2-2z" fill="#101012"/>
          <circle cx="9.4" cy="10.7" r="1.35" fill="#FFD60A"/>
          <circle cx="14.6" cy="10.7" r="1.35" fill="#FFD60A"/>
        </svg>
      </span>
      <span class="brand-name" data-i18n="brand">數字人殿堂</span>
    </a>

    <div class="header-tools">
      <div id="langSwitch"></div>
      <button type="button" class="btn-yellow js-open-login">
        <span data-i18n="nav.start">開始對話</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M7 17L17 7M9 7h8v8"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <h1 data-i18n-headline></h1>
      <p class="lede" data-i18n="hero.lede">與歷史人物即時對話 · 語音互動</p>
      <div class="hero-cta">
        <button type="button" class="btn-dark js-open-login">
          <span data-i18n="hero.cta">開始對話</span>
          <span class="go" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="#101012" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7M9 7h8v8"/>
            </svg>
          </span>
        </button>
        <p class="support" data-i18n="hero.support">和偉大的靈魂，聊聊今天的你</p>
      </div>
    </div>

    <aside class="hero-note" aria-hidden="true">
      <p data-i18n="hero.note">好的對話，讓過去與現在相遇。</p>
      <svg class="swoosh" viewBox="0 0 220 20" fill="none" preserveAspectRatio="none">
        <path d="M3 14C48 4 112 2 172 7c18 1.5 33 4 45 7" stroke="var(--note-accent)" stroke-width="2.2" stroke-linecap="round" opacity=".62"/>
      </svg>
      <svg class="ticks" viewBox="0 0 26 26" fill="none">
        <path d="M4 16L8 6M13 14L15 3M21 15l4-8" stroke="var(--note-accent)" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
      </svg>
    </aside>
  </section>

  <main class="roster" id="roster"></main>

  <footer class="site-foot"><span data-i18n="foot.build">內部測試版本</span> v 0.9.27</footer>
</div>

<div class="modal-back" id="modalBack">
  <div class="login-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <button class="login-close" id="modalClose" data-i18n-attr="aria-label:login.close,title:login.close">×</button>

    <div class="login-head">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4.6 4.9h14.8a2 2 0 0 1 2 2v7.6a2 2 0 0 1-2 2h-7.1l-4.6 3.9v-3.9H4.6a2 2 0 0 1-2-2V6.9a2 2 0 0 1 2-2z" fill="#101012"/>
          <circle cx="9.4" cy="10.7" r="1.35" fill="#FFD60A"/>
          <circle cx="14.6" cy="10.7" r="1.35" fill="#FFD60A"/>
        </svg>
      </span>
      <div>
        <h2 id="loginTitle" data-i18n="login.title">登入殿堂</h2>
        <p>DIGITAL HUMAN PALACE</p>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <form id="loginForm" autocomplete="on">
      <div class="lf-field">
        <label for="username" data-i18n="login.username">帳號</label>
        <input type="text" id="username" name="username" data-i18n-attr="placeholder:login.userph"
               autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="lf-field">
        <label for="password" data-i18n="login.password">密碼</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" data-i18n-attr="placeholder:login.passph"
                 autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" data-i18n-attr="aria-label:login.showpw">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submitBtn" data-i18n="login.submit">登入</button>
    </form>

    <div class="login-foot">
      <p data-i18n="login.note">帳號由管理員統一開通，如需開通請聯繫管理員</p>
      <div class="tiers">
        <div class="tier">
          <div class="t-name" data-i18n="login.tier1.name">體驗帳戶</div>
          <div class="t-desc" data-i18n="login.tier1.desc">20 次對話</div>
        </div>
        <div class="tier premium">
          <div class="t-name" data-i18n="login.tier2.name">高級帳戶</div>
          <div class="t-desc" data-i18n="login.tier2.desc">全套服務 · 不限次數</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const msgEl = $('msg');
const modalBack = $('modalBack');
const roster = $('roster');

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ── Showcase row ──────────────────────────────────────────────
   Fixed on the welcome page: this is a public marketing surface,
   so it shows the three historical figures rather than whatever
   /api/characters would expose (that list includes per-client
   characters and is meant to be filtered by account).            */
const SHOWCASE = [
  { id: 'character-49fd372d', icon: '/characters/character-49fd372d/portrait.jpg' },
  { id: 'maryknoll-teacher',  icon: '/characters/maryknoll-teacher/portrait.jpg' },
  { id: 'elizabeth-i',        icon: '/characters/elizabeth-i/portrait.jpg' }
];

const ARROW_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#101012" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M4 12h15M13 6l6 6-6 6"/></svg>';

const PLUS_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#101012" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">' +
  '<path d="M12 5v14M5 12h14"/></svg>';

const SILHOUETTE_SVG =
  '<svg class="silhouette" viewBox="0 0 200 217" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
    '<defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%">' +
      '<feGaussianBlur stdDeviation="9"/></filter></defs>' +
    '<g filter="url(#soft)" fill="#9BA3AC" opacity=".62">' +
      '<circle cx="100" cy="88" r="42"/>' +
      '<path d="M100 137c-38 0-66 25-72 60v40h144v-40c-6-35-34-60-72-60z"/>' +
    '</g>' +
  '</svg>';

function renderRoster() {
  roster.innerHTML = '';

  SHOWCASE.forEach((ch, i) => {
    const meta = I18N.character(ch, i);
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card._ch = ch;
    card._i = i;
    card.setAttribute('aria-label', I18N.t('card.aria', { name: meta.name }));
    card.onclick = openModal;
    card.innerHTML =
      `<div class="card-media" style="--tint:${meta.tint}">` +
        `<img src="${meta.art}" alt="" loading="lazy" onerror="this.remove()">` +
      `</div>` +
      `<div class="card-foot">` +
        `<div class="card-text">` +
          `<div class="card-name">${escapeHtml(meta.name)}</div>` +
          `<div class="card-sub">${escapeHtml(meta.sub)}</div>` +
        `</div>` +
        `<span class="card-go">${ARROW_SVG}</span>` +
      `</div>`;
    roster.appendChild(card);
  });

  const create = document.createElement('button');
  create.type = 'button';
  create.className = 'card-create';
  create.setAttribute('aria-label', I18N.t('create.name'));
  create.onclick = openModal;
  create.innerHTML =
    `<div class="card-media">${SILHOUETTE_SVG}<div class="qmark" aria-hidden="true">?</div></div>` +
    `<div class="card-foot">` +
      `<div class="card-text">` +
        `<div class="card-name">${escapeHtml(I18N.t('create.name'))}</div>` +
        `<div class="card-sub">${escapeHtml(I18N.t('create.sub'))}</div>` +
      `</div>` +
      `<span class="card-go">${PLUS_SVG}</span>` +
    `</div>`;
  roster.appendChild(create);
}

// Language changes only swap text — rebuilding would reload every portrait.
function relabelRoster() {
  roster.querySelectorAll('.card').forEach(card => {
    if (!card._ch) return;
    const meta = I18N.character(card._ch, card._i);
    card.querySelector('.card-name').textContent = meta.name;
    card.querySelector('.card-sub').textContent = meta.sub;
    card.querySelector('.card-media').style.setProperty('--tint', meta.tint);
    card.setAttribute('aria-label', I18N.t('card.aria', { name: meta.name }));
  });

  const create = roster.querySelector('.card-create');
  if (create) {
    create.setAttribute('aria-label', I18N.t('create.name'));
    create.querySelector('.card-name').textContent = I18N.t('create.name');
    create.querySelector('.card-sub').textContent = I18N.t('create.sub');
  }
}

/* ── Modal ─────────────────────────────────────────────────────── */

function showMsg(text, kind = 'error') { msgEl.textContent = text; msgEl.className = `msg show ${kind}`; }
function clearMsg() { msgEl.className = 'msg'; }

function openModal() {
  modalBack.classList.add('open');
  setTimeout(() => $('username').focus(), 60);
}
function closeModal() { modalBack.classList.remove('open'); clearMsg(); }

document.querySelectorAll('.js-open-login').forEach(el => el.addEventListener('click', openModal));
$('modalClose').addEventListener('click', closeModal);
modalBack.addEventListener('click', e => { if (e.target === modalBack) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalBack.classList.contains('open')) closeModal(); });

// 已登录的一般用户直接进殿堂；已登录的管理员不导入消费端，留在封面（管理平台走独立網址）
(async function checkExisting() {
  let token = '';
  try { token = localStorage.getItem('dh_session_token') || ''; } catch (_) {}
  if (!token) return;
  try {
    const r = await fetch('/api/auth/session', { headers: { 'X-Session-Token': token } });
    const d = await r.json();
    if (d.authenticated && d.role !== 'admin') location.replace(nextTarget(d));
  } catch (_) {}
})();

function nextTarget(session) {
  const params = new URLSearchParams(location.search);
  const next = params.get('next');
  if (next && next.startsWith('/') && !next.startsWith('//')) return next;
  return '/index.html';
}

$('pwToggle').addEventListener('click', () => {
  const pw = $('password');
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  $('pwToggle').textContent = show ? '🙈' : '👁';
  pw.focus();
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  clearMsg();

  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { showMsg(I18N.t('login.needboth')); return; }

  const btn = $('submitBtn');
  const resetBtn = () => { btn.disabled = false; btn.textContent = I18N.t('login.submit'); };
  btn.disabled = true;
  btn.innerHTML = `<span class="spin"></span>${escapeHtml(I18N.t('login.pending'))}`;

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();

    if (!r.ok) {
      showMsg(typeof d.detail === 'string' ? d.detail : I18N.t('login.failed'));
      resetBtn();
      return;
    }

    // 殿堂只接待一般用戶——管理員帳戶就算密碼正確也不在這裡放行
    if (d.role === 'admin') {
      try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'X-Session-Token': d.token } }); } catch (_) {}
      showMsg(I18N.t('login.adminonly'));
      resetBtn();
      return;
    }

    try {
      localStorage.setItem('dh_session_token', d.token);
      localStorage.setItem('dh_session_user', JSON.stringify({
        username: d.username, display_name: d.display_name, role: d.role, features: d.features
      }));
    } catch (_) {}

    const quota = d.quota_limit === -1
      ? I18N.t('login.unlimited')
      : I18N.t('login.remaining', { n: d.quota_left });
    showMsg(I18N.t('login.welcome', { name: d.display_name, quota }), 'ok');
    setTimeout(() => location.replace(nextTarget(d)), 480);

  } catch (err) {
    showMsg(I18N.t('login.offline'));
    resetBtn();
  }
});

/* ── Localization ──────────────────────────────────────────────── */
I18N.mountSwitcher($('langSwitch'));
I18N.apply();
renderRoster();
I18N.onChange(relabelRoster);
</script>

</body>
</html>
