<!DOCTYPE html>
<html lang="zh-Hant" data-locale="zh-Hant" data-title-key="brand">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>數字人殿堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2226%22 fill=%22%23FFD60A%22/><path d=%22M26 30h48a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H48L32 80V68h-6a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z%22 fill=%22%23101012%22/><circle cx=%2240%22 cy=%2249%22 r=%224.5%22 fill=%22%23FFD60A%22/><circle cx=%2256%22 cy=%2249%22 r=%224.5%22 fill=%22%23FFD60A%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/palace.css">
<script src="/js/i18n.js"></script>
<style>
  /* ── Creation wizard ──────────────────────────────────────────
     Same flow and same element ids as before, relit for the light
     theme so it no longer reads as a different product.           */
  .wizard-overlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(16,24,40,.34);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .wizard-overlay.open { display: flex; }
  .wizard {
    width: min(780px, 100%);
    max-height: 92vh;
    overflow: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 40px 90px -30px rgba(16,24,40,.45);
  }
  .wizard-head {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line-2);
    padding: 20px 22px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .wizard-title { font-size: 20px; font-weight: 800; letter-spacing: -0.015em; }
  .wizard-close {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 21px;
    line-height: 1;
    flex-shrink: 0;
  }
  .wizard-close:hover { background: #F5F6F8; }
  .wizard-body { padding: 22px; }
  .wizard-steps {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 22px;
  }
  .step-dot { height: 5px; border-radius: 999px; background: #E9EBEF; }
  .step-dot.on { background: var(--yellow); }
  .wizard-panel { display: none; }
  .wizard-panel.active { display: block; }
  .field { margin-bottom: 15px; }
  .field label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 7px;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    border: 1px solid var(--line);
    background: #FCFDFD;
    border-radius: 10px;
    color: var(--ink);
    padding: 11px 12px;
    font: 14px/1.5 var(--font-sans);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--yellow-deep);
    box-shadow: 0 0 0 3px rgba(255,214,10,.28);
    background: #fff;
  }
  .field textarea { min-height: 112px; resize: vertical; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .wizard-actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  .wiz-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    border-radius: 10px;
    padding: 11px 17px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    min-width: 98px;
  }
  .wiz-btn:hover { background: #F5F6F8; }
  .wiz-btn.primary {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--ink);
    font-weight: 700;
  }
  .wiz-btn.primary:hover { background: var(--yellow-deep); border-color: var(--yellow-deep); }
  .wiz-btn:disabled { opacity: .5; cursor: wait; }
  .status-line { min-height: 20px; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .status-line.error { color: #C8322D; }
  .image-choice-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
    gap: 12px;
    margin-top: 12px;
  }
  .image-choice {
    border: 2px solid transparent;
    border-radius: 12px;
    overflow: hidden;
    background: #F2F4F6;
    cursor: pointer;
  }
  .image-choice.selected { border-color: var(--yellow-deep); }
  .image-choice img { width: 100%; aspect-ratio: 3/4; display: block; object-fit: cover; }
  .preview-video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .preview-video-grid video {
    width: 100%;
    aspect-ratio: 3/4;
    object-fit: cover;
    background: #111;
    border-radius: 12px;
  }
  #fileInput, #knowledgeInput { display: none; }

  @media (max-width: 620px) {
    .two-col, .preview-video-grid { grid-template-columns: 1fr; }
    .wizard-body { padding: 18px; }
  }
</style>
</head>

  <section class="hero">

      <div class="hero-cta">

<input type="file" id="fileInput" accept=".zip">

<div class="wizard-overlay" id="wizardOverlay">
  <div class="wizard">
    <div class="wizard-head">
      <div>
        <div class="wizard-title">創建新角色</div>
        <div class="status-line" id="wizardSubtitle">API Key 只保存在本次頁面會話</div>
      </div>

      <section class="wizard-panel active" data-step="0">

        <div class="status-line" id="keyStatus"></div>

          <div class="field"><label>英文/副標題</label><input id="wizNameEn" placeholder="Poet Immortal"></div>

        <div class="field"><label>角色定位</label><input id="wizRole" placeholder="唐代詩人 / 科幻導師 / 品牌顧問"></div>

        <button class="wiz-btn primary" id="btnBuildPrompt">潤色角色 Prompt</button>

      <section class="wizard-panel" data-step="2">

<script>
const roster = document.getElementById('roster');
const fileInput = document.getElementById('fileInput');
const knowledgeInput = document.getElementById('knowledgeInput');

// ── Auth State ──
let userCode = '';
let userName = '';
try { userCode = localStorage.getItem('dh_user_code') || ''; } catch(_) {}
try { userName = localStorage.getItem('dh_user_name') || ''; } catch(_) {}

// ── 帳戶會話（新帳號體系）──
let SESSION_TOKEN = '';
let SESSION = null;
try { SESSION_TOKEN = localStorage.getItem('dh_session_token') || ''; } catch(_) {}

function gotoLogin() {
  try {
    localStorage.removeItem('dh_session_token');
    localStorage.removeItem('dh_session_user');
  } catch(_) {}
  location.replace('/login.html?next=' + encodeURIComponent(location.pathname + location.search));
}

if (!SESSION_TOKEN) gotoLogin();

(async function verifySession() {
  if (!SESSION_TOKEN) return;
  try {
    const r = await fetch('/api/auth/session', { headers: { 'X-Session-Token': SESSION_TOKEN } });
    const d = await r.json();
    if (!d.authenticated) { gotoLogin(); return; }
    SESSION = d;
    // 高級／管理員帳戶無需再輸邀請碼即可創建角色
    if (d.features && d.features.create_character) {
      userName = d.display_name || d.username;
    }
    renderSessionChip();
  } catch(_) {}
})();

// ── Header session chip ──────────────────────────────────────────
const sessionChip = document.getElementById('sessionChip');

function renderSessionChip() {
  const d = SESSION;
  if (!d) { sessionChip.hidden = true; return; }
  sessionChip.hidden = false;

  const quota = d.quota_limit === -1
    ? `<span class="quota-premium">${I18N.t('session.premium')}</span>`
    : `${I18N.t('session.trial')} <b class="${d.quota_left <= 5 ? 'quota-low' : ''}">${d.quota_left}</b>/${d.quota_limit}`;

  sessionChip.innerHTML =
    `<span class="who">${escapeHtml(d.display_name || d.username)}</span>` +
    `<span class="sep">·</span>${quota}` +
    (d.features && d.features.admin_console
      ? `<a href="/ops.html">${I18N.t('session.console')}</a>` : '') +
    `<a href="#" id="sbLogout">${I18N.t('session.logout')}</a>`;

  const lo = document.getElementById('sbLogout');
  if (lo) lo.onclick = async e => {
    e.preventDefault();
    try { await fetch('/api/auth/logout', { method: 'POST', headers: { 'X-Session-Token': SESSION_TOKEN } }); } catch(_) {}
    gotoLogin();
  };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function verifyCode(code) {
  const res = await fetch('/api/auth/verify', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({code}),
  });
  if (!res.ok) return null;
  const data = await res.json();
  return data.username;
}

// Video preview memory management: only one playing at a time
let _hoverVideo = null;

function _hoverIn(card, videoUrl) {
  _hoverOut();
  const media = card.querySelector('.card-media');
  if (!media || !videoUrl) return;
  const vid = document.createElement('video');
  vid.src = videoUrl;
  vid.loop = true;
  vid.muted = true;
  vid.playsInline = true;
  vid.play().catch(() => {});
  media.appendChild(vid);
  _hoverVideo = vid;
}

function _hoverOut() {
  if (_hoverVideo) {
    _hoverVideo.pause();
    _hoverVideo.src = '';
    _hoverVideo.remove();
    _hoverVideo = null;
  }
}

// ── Roster ───────────────────────────────────────────────────────
let CHARS = [];

const ARROW_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#101012" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M4 12h15M13 6l6 6-6 6"/></svg>';

const PLUS_SVG =
  '<svg viewBox="0 0 24 24" fill="none" stroke="#101012" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">' +
  '<path d="M12 5v14M5 12h14"/></svg>';

// Soft-blurred head-and-shoulders field for the "create your own" card.
const SILHOUETTE_SVG =
  '<svg class="silhouette" viewBox="0 0 200 217" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
    '<defs><filter id="soft" x="-30%" y="-30%" width="160%" height="160%">' +
      '<feGaussianBlur stdDeviation="9"/></filter></defs>' +
    '<g filter="url(#soft)" fill="#9BA3AC" opacity=".62">' +
      '<circle cx="100" cy="88" r="42"/>' +
      '<path d="M100 137c-38 0-66 25-72 60v40h144v-40c-6-35-34-60-72-60z"/>' +
    '</g>' +
  '</svg>';

function showSkeletons(n) {
  roster.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const sk = document.createElement('div');
    sk.className = 'card-skeleton';
    sk.innerHTML = '<div class="sk-media"></div><div class="sk-foot"><div class="sk-line"></div><div class="sk-line"></div></div>';
    roster.appendChild(sk);
  }
}

function showState(key, isError) {
  roster.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'state' + (isError ? ' error' : '');
  el.dataset.i18n = key;
  el.textContent = I18N.t(key);
  roster.appendChild(el);
}

function buildCard(ch, index) {
  const meta = I18N.character(ch, index);

  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card';
  card._ch = ch;
  card._i = index;
  card.setAttribute('aria-label', I18N.t('card.aria', { name: meta.name }));
  card.onclick = () => { location.href = `/?char=${encodeURIComponent(ch.id)}`; };
  card.addEventListener('mouseenter', () => _hoverIn(card, ch.avatar_idle));
  card.addEventListener('mouseleave', _hoverOut);

  const media = document.createElement('div');
  media.className = 'card-media';
  media.style.setProperty('--tint', meta.tint);

  const img = document.createElement('img');
  img.src = meta.art;
  img.alt = '';
  img.loading = 'lazy';
  // Fall back to the character's own portrait if a card cutout is missing.
  img.onerror = () => {
    if (img.dataset.fellBack || !ch.icon || img.src.endsWith(ch.icon)) { img.remove(); return; }
    img.dataset.fellBack = '1';
    img.src = ch.icon;
  };
  media.appendChild(img);
  card.appendChild(media);

  const foot = document.createElement('div');
  foot.className = 'card-foot';
  foot.innerHTML =
    `<div class="card-text">` +
      `<div class="card-name">${escapeHtml(meta.name)}</div>` +
      `<div class="card-sub">${escapeHtml(meta.sub)}</div>` +
    `</div>` +
    `<span class="card-go">${ARROW_SVG}</span>`;
  card.appendChild(foot);

  return card;
}

function buildCreateCard() {
  const card = document.createElement('button');
  card.type = 'button';
  card.className = 'card-create';
  card.setAttribute('aria-label', I18N.t('create.name'));
  card.onclick = async () => {
    // 高級／管理員帳戶的「全套服務」已含創建角色，不再要求邀請碼
    if (canCreateWithSession() || userCode) { openWizard(); return; }
    const code = prompt('請輸入邀請碼：');
    if (!code) return;
    const username = await verifyCode(code);
    if (!username) { alert('邀請碼無效'); return; }
    userCode = code;
    userName = username;
    localStorage.setItem('dh_user_code', code);
    localStorage.setItem('dh_user_name', username);
    openWizard();
  };

  card.innerHTML =
    `<div class="card-media">${SILHOUETTE_SVG}<div class="qmark" aria-hidden="true">?</div></div>` +
    `<div class="card-foot">` +
      `<div class="card-text">` +
        `<div class="card-name">${escapeHtml(I18N.t('create.name'))}</div>` +
        `<div class="card-sub">${escapeHtml(I18N.t('create.sub'))}</div>` +
      `</div>` +
      `<span class="card-go">${PLUS_SVG}</span>` +
    `</div>`;

  return card;
}

function renderRoster() {
  roster.innerHTML = '';
  // An account whose whitelist matches nothing would otherwise see a
  // lone create-card and no explanation.
  if (!CHARS.length) {
    const note = document.createElement('div');
    note.className = 'state';
    note.dataset.i18n = 'roster.empty';
    note.textContent = I18N.t('roster.empty');
    roster.appendChild(note);
  }
  CHARS.forEach((ch, i) => roster.appendChild(buildCard(ch, i)));
  roster.appendChild(buildCreateCard());
}

// Language changes only swap text — rebuilding would reload every portrait.
function relabelRoster() {
  roster.querySelectorAll('.card').forEach(card => {
    if (!card._ch) return;
    const meta = I18N.character(card._ch, card._i);
    card.querySelector('.card-name').textContent = meta.name;
    card.querySelector('.card-sub').textContent = meta.sub;
    card.querySelector('.card-media').style.setProperty('--tint', meta.tint);
    card.setAttribute('aria-label', I18N.t('card.aria', { name: meta.name }));
  });

  const create = roster.querySelector('.card-create');
  if (create) {
    create.setAttribute('aria-label', I18N.t('create.name'));
    create.querySelector('.card-name').textContent = I18N.t('create.name');
    create.querySelector('.card-sub').textContent = I18N.t('create.sub');
  }
}

async function loadCharacters() {
  showSkeletons(4);
  try {
    const res = await fetch('/api/characters', {
      headers: SESSION_TOKEN ? { 'X-Session-Token': SESSION_TOKEN } : {},
    });
    CHARS = await res.json();
    renderRoster();
  } catch (e) {
    showState('roster.error', true);
  }
}

// Both "start chatting" buttons open the first character available.
function startChatting() {
  if (CHARS.length) {
    location.href = `/?char=${encodeURIComponent(CHARS[0].id)}`;
  } else {
    roster.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}
document.getElementById('btnHeaderStart').onclick = startChatting;
document.getElementById('btnHeroStart').onclick = startChatting;

// ── Localization ─────────────────────────────────────────────────
I18N.mountSwitcher(document.getElementById('langSwitch'));
I18N.apply();
I18N.onChange(() => {
  relabelRoster();
  renderSessionChip();
});

// ── Creation Wizard ───────────────────────────────────
const wizardOverlay = document.getElementById('wizardOverlay');
const wizardPanels = [...document.querySelectorAll('.wizard-panel')];
const wizardSteps = document.getElementById('wizardSteps');
let wizardStep = 0;
let sessionMiniMaxKey = '';
let keyValidated = false;

// 高級／管理員帳戶：後端已按帳戶備好 Key，前端無需手填也拿不到 Key 值
function canCreateWithSession() {
  return !!(SESSION && SESSION.features && SESSION.features.create_character);
}
function usesServerKey() {
  return !!(SESSION && SESSION.features && SESSION.features.server_key);
}
let createState = {
  promptJobId: '',
  systemPrompt: '',
  images: [],
  selectedImageId: '',
  videos: null,
};

for (let i = 0; i < wizardPanels.length; i++) {
  const dot = document.createElement('div');
  dot.className = 'step-dot';
  wizardSteps.appendChild(dot);
}

function $(id) { return document.getElementById(id); }

function setStatus(id, text, isError = false) {
  const el = $(id);
  if (!el) return;
  el.textContent = text || '';
  el.classList.toggle('error', !!isError);
}

function setBusy(btn, busy, text) {
  if (!btn) return;
  if (busy) {
    btn.dataset.oldText = btn.textContent;
    btn.textContent = text || '處理中...';
    btn.disabled = true;
  } else {
    btn.textContent = btn.dataset.oldText || btn.textContent;
    btn.disabled = false;
  }
}

function clampKnowledgeInput() {
  const el = $('wizKnowledge');
  if (!el) return;
  if (el.value.length > 6000) el.value = el.value.slice(0, 6000);
  $('knowledgeCount').textContent = `${el.value.length} / 6000`;
}

function headersJson() {
  const h = { 'Content-Type': 'application/json' };
  // 不帶此 header 時後端按帳戶回退到服務端 Key；Key 值不會出現在前端
  if (sessionMiniMaxKey) h['X-MiniMax-API-Key'] = sessionMiniMaxKey;
  if (userCode) h['X-User-Code'] = userCode;
  if (SESSION_TOKEN) h['X-Session-Token'] = SESSION_TOKEN;
  return h;
}

function openWizard() {
  applyKeyMode();
  wizardOverlay.classList.add('open');
  showWizardStep(0);
}

// 依帳戶決定第 0 步的形態：平台備好 Key 時只留連結穩定性測試
function applyKeyMode() {
  const serverKey = usesServerKey();
  const field = $('apiKeyField');
  const note = $('serverKeyNote');
  const btn = $('btnTestKey');
  if (field) field.style.display = serverKey ? 'none' : '';
  if (note) note.style.display = serverKey ? '' : 'none';
  if (btn) btn.textContent = serverKey ? '測試連結穩定性' : '測試 MiniMax Key';
  if (serverKey) {
    sessionMiniMaxKey = '';
    const input = $('wizApiKey');
    if (input) input.value = '';
    setStatus('wizardSubtitle', '使用平台配置的 MiniMax 服務');
  }
}

function closeWizard() {
  wizardOverlay.classList.remove('open');
}

function showWizardStep(step) {
  wizardStep = Math.max(0, Math.min(step, wizardPanels.length - 1));
  wizardPanels.forEach((panel, idx) => panel.classList.toggle('active', idx === wizardStep));
  [...wizardSteps.children].forEach((dot, idx) => dot.classList.toggle('on', idx <= wizardStep));
  $('wizPrev').style.visibility = wizardStep === 0 ? 'hidden' : 'visible';
  $('wizNext').style.visibility = wizardStep === wizardPanels.length - 1 ? 'hidden' : 'visible';
}

function requireKey() {
  sessionMiniMaxKey = $('wizApiKey').value.trim();
  if (!sessionMiniMaxKey && usesServerKey()) {
    // 服務端已備好 Key，只要求先做一次連結穩定性測試
    if (!keyValidated) {
      setStatus('keyStatus', '請先測試連結穩定性，確認可用後再下一步', true);
      setStatus('wizardSubtitle', '尚未測試連結穩定性', true);
      showWizardStep(0);
      return false;
    }
    setStatus('wizardSubtitle', '使用平台配置的 MiniMax 服務');
    return true;
  }
  if (!sessionMiniMaxKey) {
    setStatus('wizardSubtitle', '請先填寫 MiniMax API Key（只保存於本頁面會話）', true);
    showWizardStep(0);
    return false;
  }
  if (!keyValidated) {
    setStatus('keyStatus', '請先測試 MiniMax Key，確認可用後再下一步', true);
    setStatus('wizardSubtitle', 'MiniMax Key 尚未測試通過', true);
    showWizardStep(0);
    return false;
  }
  setStatus('wizardSubtitle', 'API Key 已在本頁面會話中就緒，刷新後會丟失');
  return true;
}

function baseCharacterPayload() {
  return {
    name: $('wizName').value.trim(),
    name_en: $('wizNameEn').value.trim(),
    role: $('wizRole').value.trim(),
    background: $('wizBackground').value.trim(),
    speaking_style: $('wizSpeaking').value.trim(),
    knowledge_text: $('wizKnowledge').value.trim().slice(0, 6000),
    language: 'Chinese,Yue',
  };
}

async function ensurePrompt(force = false) {
  if (!force && createState.systemPrompt) return createState.systemPrompt;
  if (!requireKey()) throw new Error('missing_api_key');
  const payload = baseCharacterPayload();
  if (!payload.name || !payload.background || !payload.speaking_style) {
    throw new Error('請先填寫角色名稱、背景設定和說話設定');
  }
  const res = await fetch('/api/create/prompt', {
    method: 'POST',
    headers: headersJson(),
    body: JSON.stringify(payload),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || 'Prompt 生成失敗'));
  createState.promptJobId = data.job_id;
  createState.systemPrompt = data.system_prompt;
  $('wizSystemPrompt').value = data.system_prompt;
  $('wizFinalPrompt').value = data.system_prompt;
  return data.system_prompt;
}

$('wizardClose').onclick = closeWizard;
wizardOverlay.addEventListener('click', e => { if (e.target === wizardOverlay) closeWizard(); });
$('wizPrev').onclick = () => showWizardStep(wizardStep - 1);
$('wizNext').onclick = async () => {
  if (wizardStep === 0 && !requireKey()) return;
  if (wizardStep === 1 && $('wizSystemPrompt').value.trim()) {
    createState.systemPrompt = $('wizSystemPrompt').value.trim();
    $('wizFinalPrompt').value = createState.systemPrompt;
  }
  showWizardStep(wizardStep + 1);
};

$('wizApiKey').addEventListener('input', () => {
  keyValidated = false;
  setStatus('keyStatus', 'Key 已變更，請重新測試');
  setStatus('wizardSubtitle', 'API Key 只保存在本次頁面會話');
});

$('btnTestKey').onclick = async () => {
  const btn = $('btnTestKey');
  sessionMiniMaxKey = $('wizApiKey').value.trim();
  const serverKey = !sessionMiniMaxKey && usesServerKey();
  if (!sessionMiniMaxKey && !serverKey) {
    setStatus('keyStatus', '請先填寫 MiniMax API Key', true);
    return;
  }
  setBusy(btn, true, '測試中...');
  setStatus('keyStatus', serverKey ? '正在測試與 MiniMax 的連結穩定性...' : '正在用 MiniMax 做一次輕量文本測試...');
  try {
    const res = await fetch('/api/create/test-key', { method: 'POST', headers: headersJson() });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || 'MiniMax 連結測試失敗'));
    keyValidated = true;
    setStatus('keyStatus', `連結正常，延遲 ${data.latency_ms}ms`);
    setStatus('wizardSubtitle', data.server_key ? '使用平台配置的 MiniMax 服務' : 'API Key 已測試通過，刷新後會丟失');
  } catch (e) {
    keyValidated = false;
    setStatus('keyStatus', e.message, true);
    setStatus('wizardSubtitle', 'MiniMax Key 測試未通過', true);
  } finally {
    setBusy(btn, false);
  }
};

$('btnBuildPrompt').onclick = async () => {
  const btn = $('btnBuildPrompt');
  setBusy(btn, true, '潤色中...');
  setStatus('promptStatus', '正在調用 MiniMax 優化角色提示詞...');
  try {
    await ensurePrompt(true);
    setStatus('promptStatus', '角色 Prompt 已生成，可在最後一步微調。');
  } catch (e) {
    setStatus('promptStatus', e.message, true);
  } finally {
    setBusy(btn, false);
  }
};

$('btnKnowledgeUpload').onclick = () => knowledgeInput.click();
knowledgeInput.onchange = async () => {
  const file = knowledgeInput.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  setStatus('knowledgeStatus', '正在提取文件文本...');
  try {
    const h = {};
    if (userCode) h['X-User-Code'] = userCode;
    if (SESSION_TOKEN) h['X-Session-Token'] = SESSION_TOKEN;
    const res = await fetch('/api/create/knowledge', { method: 'POST', body: form, headers: h });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || '知識庫提取失敗'));
    $('wizKnowledge').value = data.text;
    clampKnowledgeInput();
    setStatus('knowledgeStatus', `已提取 ${data.chars} 字${data.truncated ? '（已截斷）' : ''}`);
  } catch (e) {
    setStatus('knowledgeStatus', e.message, true);
  } finally {
    knowledgeInput.value = '';
  }
};

$('wizKnowledge').addEventListener('input', clampKnowledgeInput);
clampKnowledgeInput();

$('btnKnowledgeSearch').onclick = async () => {
  const btn = $('btnKnowledgeSearch');
  if (!requireKey()) return;
  setBusy(btn, true, '搜索中...');
  setStatus('knowledgeStatus', '正在 Web Search 並整理為 6000 字以內知識庫...');
  try {
    const payload = baseCharacterPayload();
    payload.query = $('wizSearchQuery').value.trim();
    const res = await fetch('/api/create/knowledge/search', {
      method: 'POST',
      headers: headersJson(),
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || 'Web Search 生成失敗'));
    $('wizKnowledge').value = data.text || '';
    clampKnowledgeInput();
    setStatus('knowledgeStatus', `已根據「${data.query}」生成知識庫，來源 ${data.sources?.length || 0} 條`);
  } catch (e) {
    setStatus('knowledgeStatus', e.message, true);
  } finally {
    setBusy(btn, false);
  }
};

$('btnBuildImagePrompt').onclick = async () => {
  const btn = $('btnBuildImagePrompt');
  if (!requireKey()) return;
  setBusy(btn, true, '生成中...');
  setStatus('imageStatus', '正在根據角色內容生成圖像 Prompt...');
  try {
    const payload = baseCharacterPayload();
    payload.system_prompt = $('wizSystemPrompt').value.trim() || createState.systemPrompt || '';
    const res = await fetch('/api/create/image-prompt', {
      method: 'POST',
      headers: headersJson(),
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || '圖像 Prompt 生成失敗'));
    $('wizImagePrompt').value = data.prompt || '';
    setStatus('imageStatus', '圖像 Prompt 已生成並填入，可直接生成候選圖。');
  } catch (e) {
    setStatus('imageStatus', e.message, true);
  } finally {
    setBusy(btn, false);
  }
};

$('btnGenerateImages').onclick = async () => {
  const btn = $('btnGenerateImages');
  if (!requireKey()) return;
  setBusy(btn, true, '生成中...');
  setStatus('imageStatus', '正在準備 Prompt 並生成候選圖...');
  try {
    if ($('wizSystemPrompt').value.trim()) {
      createState.systemPrompt = $('wizSystemPrompt').value.trim();
      $('wizFinalPrompt').value = createState.systemPrompt;
    } else {
      await ensurePrompt(true);
    }
    const imagePrompt = $('wizImagePrompt').value.trim();
    if (!imagePrompt) throw new Error('請先填寫形象描述');
    const res = await fetch('/api/create/images', {
      method: 'POST',
      headers: headersJson(),
      body: JSON.stringify({
        prompt: imagePrompt,
        reference_description: `${$('wizName').value.trim()} ${$('wizRole').value.trim()}`.trim(),
        count: 4,
        job_id: createState.promptJobId || '',
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || '圖片生成失敗'));
    createState.promptJobId = data.job_id;
    createState.images = data.images || [];
    renderImageChoices();
    setStatus('imageStatus', `已生成 ${createState.images.length} 張候選圖，請選一張。`);
    showWizardStep(4);
  } catch (e) {
    setStatus('imageStatus', e.message, true);
  } finally {
    setBusy(btn, false);
  }
};

function renderImageChoices() {
  const box = $('imageChoices');
  box.innerHTML = '';
  createState.images.forEach(img => {
    const item = document.createElement('div');
    item.className = 'image-choice' + (img.id === createState.selectedImageId ? ' selected' : '');
    item.innerHTML = `<img src="${img.url}" alt="候選角色圖">`;
    item.onclick = () => {
      createState.selectedImageId = img.id;
      renderImageChoices();
    };
    box.appendChild(item);
  });
  if (!createState.selectedImageId && createState.images[0]) {
    createState.selectedImageId = createState.images[0].id;
    renderImageChoices();
  }
}

$('btnGenerateVideos').onclick = async () => {
  const btn = $('btnGenerateVideos');
  if (!requireKey()) return;
  if (!createState.selectedImageId) {
    setStatus('videoStatus', '請先選擇一張候選圖', true);
    return;
  }
  setBusy(btn, true, '視頻生成中...');
  setStatus('videoStatus', '正在生成 idle/talk 視頻，這一步可能需要數分鐘...');
  try {
    const res = await fetch('/api/create/videos', {
      method: 'POST',
      headers: headersJson(),
      body: JSON.stringify({
        job_id: createState.promptJobId,
        image_id: createState.selectedImageId,
        character_name: $('wizName').value.trim(),
        image_prompt: $('wizImagePrompt').value.trim(),
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || '視頻生成失敗'));
    createState.videos = data.videos;
    $('videoPreview').innerHTML = `
      <video src="${data.videos.idle}" autoplay muted loop playsinline></video>
      <video src="${data.videos.talk}" autoplay muted loop playsinline></video>`;
    setStatus('videoStatus', '視頻已生成並完成去音軌/壓縮。');
    showWizardStep(5);
  } catch (e) {
    setStatus('videoStatus', e.message, true);
  } finally {
    setBusy(btn, false);
  }
};

$('btnFinalize').onclick = async () => {
  const btn = $('btnFinalize');
  if (!createState.videos) {
    setStatus('finalStatus', '請先完成視頻生成', true);
    return;
  }
  setBusy(btn, true, '寫入中...');
  setStatus('finalStatus', '正在寫入角色目錄...');
  try {
    const name = $('wizName').value.trim();
    const res = await fetch('/api/create/finalize', {
      method: 'POST',
      headers: headersJson(),
      body: JSON.stringify({
        job_id: createState.promptJobId,
        character_id: name,
        name,
        name_en: $('wizNameEn').value.trim(),
        role: $('wizRole').value.trim(),
        system_prompt: $('wizFinalPrompt').value.trim() || createState.systemPrompt,
        tts_voice_id: $('wizTtsVoice').value.trim() || 'Cantonese_PlayfulMan',
        tts_language: $('wizTtsLanguage').value.trim() || 'Chinese,Yue',
        theme_color: '#8A6D3B',
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(typeof data.detail === 'object' ? JSON.stringify(data.detail) : (data.detail || '角色寫入失敗'));
    setStatus('finalStatus', '角色已加入大廳，正在刷新...');
    closeWizard();
    await loadCharacters();
  } catch (e) {
    setStatus('finalStatus', e.message, true);
  } finally {
    setBusy(btn, false);
  }
};

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const h = {};
    if (userCode) h['X-User-Code'] = userCode;
    if (SESSION_TOKEN) h['X-Session-Token'] = SESSION_TOKEN;
    const res = await fetch('/api/characters/import', { method: 'POST', body: form, headers: h });
    if (res.ok) { loadCharacters(); }
    else { const e = await res.json(); alert('導入失敗: ' + (e.detail || '未知錯誤')); }
  } catch(e) { alert('導入失敗: ' + e.message); }
  fileInput.value = '';
};

// Voice-language sync: auto-switch language when voice changes
$('wizTtsVoice').addEventListener('change', function() {
  const opt = this.options[this.selectedIndex];
  const lang = opt.closest('optgroup')?.dataset.lang;
  if (lang) $('wizTtsLanguage').value = lang;
});

loadCharacters();
</script>
