<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>數字人平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Sans TC", -apple-system, sans-serif;
    background: #08080f;
    color: #d4c8b0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── Background ambient glow ── */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(138,109,59,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  .header {
    position: relative;
    z-index: 1;
    padding: 50px 24px 10px;
    text-align: center;
  }
  .header h1 {
    font-family: "Noto Serif TC", serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: 6px;
    color: #c8b888;
    text-shadow: 0 0 40px rgba(180,140,90,0.15);
  }
  .header .subtitle {
    font-size: 13px;
    font-weight: 300;
    color: #6b6048;
    margin-top: 10px;
    letter-spacing: 2px;
  }

  /* ── Grid ── */
  .grid {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 22px;
    padding: 28px 24px 60px;
    max-width: 640px;
    width: 100%;
  }

  /* ── Character Card ── */
  .card {
    background: rgba(20,18,12,0.7);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(180,140,90,0.3);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 20px rgba(138,109,59,0.1);
  }
  .card:active { transform: scale(0.97); }

  .card-media {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(30,25,15,0.8), rgba(10,10,15,0.9));
  }
  .card-media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s ease;
  }
  .card:hover .card-media img { transform: scale(1.05); }

  /* ── Hover video preview ── */
  .card-media .hover-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    z-index: 2;
  }
  .card:hover .card-media .hover-video { opacity: 1; }

  .card-media .gradient-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 50%;
    background: linear-gradient(to top, rgba(8,8,15,0.9), transparent);
    pointer-events: none;
  }

  .card-body {
    padding: 15px 16px;
    text-align: center;
  }
  .card-name {
    font-family: "Noto Serif TC", serif;
    font-size: 17px;
    font-weight: 500;
    color: #d4c8b0;
    letter-spacing: 2px;
  }
  .card-role {
    font-size: 11px;
    font-weight: 300;
    color: #8a7b5a;
    margin-top: 4px;
  }

  /* ── Import Card ── */
  .card-import {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 280px;
    background: rgba(20,18,12,0.4);
    border: 2px dashed rgba(255,255,255,0.08);
    border-radius: 18px;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(4px);
  }
  .card-import:hover {
    border-color: rgba(180,140,90,0.3);
    background: rgba(30,25,15,0.5);
  }
  .card-import .icon-circle {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    transition: background 0.3s;
  }
  .card-import:hover .icon-circle { background: rgba(255,255,255,0.07); }
  .card-import .icon-circle svg { width: 22px; height: 22px; stroke: #6b6048; }
  .card-import span {
    font-size: 13px;
    color: #6b6048;
    font-weight: 300;
    letter-spacing: 1px;
  }

  /* ── States ── */
  .loading, .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: #4a4030;
    font-size: 14px;
    font-weight: 300;
  }

  #fileInput { display: none; }

  /* ── Footer ── */
  .footer {
    position: relative;
    z-index: 1;
    padding: 0 20px 30px;
    font-size: 11px;
    color: #3a3028;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>數 字 人 殿 堂</h1>
  <p class="subtitle">與歷史對話</p>
</div>

<div class="grid" id="grid">
  <div class="loading">靜候先賢降臨…</div>
</div>

<div class="footer">Digital Human Platform</div>
<input type="file" id="fileInput" accept=".zip">

<script>
const grid = document.getElementById('grid');
const fileInput = document.getElementById('fileInput');

// Video preview memory management: only one playing at a time
let _hoverCard = null;
let _hoverVideo = null;

function _hoverIn(card, videoUrl) {
  // Clean up any existing hover video first
  _hoverOut();
  _hoverCard = card;
  const media = card.querySelector('.card-media');
  const vid = document.createElement('video');
  vid.className = 'hover-video';
  vid.src = videoUrl;
  vid.loop = true;
  vid.muted = true;
  vid.playsInline = true;
  vid.play().catch(() => {});
  media.appendChild(vid);
  _hoverVideo = vid;
}

function _hoverOut() {
  if (_hoverVideo) {
    _hoverVideo.pause();
    _hoverVideo.src = '';
    _hoverVideo.remove();
    _hoverVideo = null;
  }
  _hoverCard = null;
}

async function loadCharacters() {
  try {
    const res = await fetch('/api/characters');
    const chars = await res.json();
    grid.innerHTML = '';

    if (chars.length === 0) {
      grid.innerHTML = '<div class="empty">尚無角色，請導入 .zip 檔案</div>';
    }

    chars.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'card';
      card.onclick = () => { location.href = `/?char=${encodeURIComponent(ch.id)}`; };
      card.addEventListener('mouseenter', () => _hoverIn(card, ch.avatar_idle));
      card.addEventListener('mouseleave', () => _hoverOut());
      card.innerHTML = `
        <div class="card-media">
          <img src="${ch.icon}" alt="${ch.name}" onerror="this.style.display='none'">
          <div class="gradient-overlay"></div>
        </div>
        <div class="card-body">
          <div class="card-name">${ch.name}</div>
          <div class="card-role">${ch.name_en || '歷史人物'}</div>
        </div>`;
      grid.appendChild(card);
    });

    // Import card
    const imp = document.createElement('div');
    imp.className = 'card-import';
    imp.onclick = () => fileInput.click();
    imp.innerHTML = `
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <span>導入角色</span>`;
    grid.appendChild(imp);

  } catch(e) {
    grid.innerHTML = '<div class="loading">無法連接伺服器</div>';
  }
}

fileInput.onchange = async () => {
  const file = fileInput.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('file', file);
  try {
    const res = await fetch('/api/characters/import', { method: 'POST', body: form });
    if (res.ok) { loadCharacters(); }
    else { const e = await res.json(); alert('導入失敗: ' + (e.detail || '未知錯誤')); }
  } catch(e) { alert('導入失敗: ' + e.message); }
  fileInput.value = '';
};

loadCharacters();
</script>
</body>
</html>
