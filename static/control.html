<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>主站控制 · Digital Human</title>
  <script>
    (() => {
      const pref = localStorage.getItem('opsTheme') || 'system';
      const dark = matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = pref === 'system' ? (dark ? 'dark' : 'light') : pref;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg:#f7f7f8; --card:#fff; --surface:#fafafb; --text:#353740;
      --text2:#6e6e80; --text3:#8e8ea0; --border:#e5e5e6;
      --accent:#10a37f; --accent-dark:#0d9168; --accent-soft:#e6f7f2;
      --warn:#b66a00; --warn-soft:#fff5e6; --danger:#cf334f; --danger-soft:#fcecf0;
      --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
      --shadow-lg:0 18px 50px rgba(20,24,32,.16); --radius:10px; --radius-sm:7px;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg:#101314; --card:#171a1c; --surface:#1d2124; --text:#e8eaed;
      --text2:#b5bac4; --text3:#858b98; --border:#2b3036;
      --accent:#19b991; --accent-dark:#10a37f; --accent-soft:rgba(25,185,145,.16);
      --warn:#f0a33a; --warn-soft:rgba(240,163,58,.14);
      --danger:#ff6b7d; --danger-soft:rgba(255,107,125,.14);
      --shadow:0 1px 3px rgba(0,0,0,.34),0 1px 2px rgba(0,0,0,.24);
      --shadow-lg:0 20px 60px rgba(0,0,0,.52);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"PingFang HK","Microsoft JhengHei",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input { font:inherit; }
    .topbar {
      position:sticky; top:0; z-index:30; min-height:64px; padding:10px 28px;
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      background:color-mix(in srgb,var(--card) 94%,transparent); border-bottom:1px solid var(--border);
      backdrop-filter:blur(16px);
    }
    .brand,.toolbar { display:flex; align-items:center; gap:10px; }
    .brand-mark {
      width:34px; height:34px; display:grid; place-items:center; border-radius:9px;
      background:var(--accent); color:#fff; box-shadow:0 6px 16px rgba(16,163,127,.18);
    }
    .brand-copy h1 { font-size:15px; letter-spacing:-.15px; }
    .brand-copy p { margin-top:2px; font-size:11px; color:var(--text3); }
    .clock { color:var(--text3); font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .btn {
      min-height:36px; padding:0 13px; display:inline-flex; align-items:center; justify-content:center; gap:7px;
      border:1px solid transparent; border-radius:var(--radius-sm); cursor:pointer; text-decoration:none;
      font-size:13px; font-weight:650; transition:.16s ease; white-space:nowrap;
    }
    .btn:focus-visible,input:focus-visible { outline:3px solid color-mix(in srgb,var(--accent) 22%,transparent); outline-offset:2px; }
    .btn:disabled { cursor:not-allowed; opacity:.42; transform:none!important; }
    .btn-ghost { color:var(--text2); background:var(--card); border-color:var(--border); }
    .btn-ghost:hover:not(:disabled) { color:var(--text); border-color:var(--text3); }
    .btn-primary { color:#fff; background:var(--accent); }
    .btn-primary:hover:not(:disabled) { background:var(--accent-dark); transform:translateY(-1px); }
    .btn-warn { color:var(--warn); background:var(--warn-soft); border-color:color-mix(in srgb,var(--warn) 26%,transparent); }
    .btn-danger { color:var(--danger); background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 28%,transparent); }
    .icon { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    main { width:min(1080px,calc(100% - 40px)); margin:32px auto 56px; }
    .hero {
      display:grid; grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr); gap:18px; margin-bottom:18px;
    }
    .card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
    .intro { padding:28px; overflow:hidden; position:relative; }
    .intro::after {
      content:""; position:absolute; width:210px; height:210px; right:-90px; top:-105px; border-radius:50%;
      background:radial-gradient(circle,var(--accent-soft),transparent 68%); pointer-events:none;
    }
    .eyebrow { color:var(--accent); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .intro h2 { margin-top:10px; max-width:640px; font-size:28px; line-height:1.18; letter-spacing:-.8px; }
    .intro p { margin-top:12px; max-width:660px; color:var(--text2); font-size:14px; line-height:1.65; }
    .safety-note { margin-top:20px; display:flex; align-items:flex-start; gap:9px; color:var(--text3); font-size:12px; line-height:1.5; }
    .auth { padding:22px; display:flex; flex-direction:column; justify-content:center; }
    .card-title { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:760; }
    .field { margin-top:16px; }
    .field label { display:block; margin-bottom:7px; color:var(--text2); font-size:12px; font-weight:650; }
    .input-row { display:flex; gap:8px; }
    input {
      min-width:0; flex:1; height:40px; padding:0 12px; border:1px solid var(--border); border-radius:var(--radius-sm);
      background:var(--surface); color:var(--text); font-size:14px;
    }
    input:focus { border-color:var(--accent); }
    .auth-state { margin-top:12px; min-height:20px; display:flex; align-items:center; gap:7px; color:var(--text3); font-size:12px; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--text3); box-shadow:0 0 0 4px color-mix(in srgb,var(--text3) 12%,transparent); }
    .auth-state.ok { color:var(--accent); }.auth-state.ok .dot { background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
    .auth-state.bad { color:var(--danger); }.auth-state.bad .dot { background:var(--danger); box-shadow:0 0 0 4px var(--danger-soft); }
    .status-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:18px; }
    .status-card { padding:18px; min-height:126px; }
    .status-label { display:flex; align-items:center; gap:7px; color:var(--text3); font-size:11px; font-weight:750; letter-spacing:.04em; text-transform:uppercase; }
    .status-value { margin-top:17px; font-size:22px; font-weight:760; letter-spacing:-.45px; }
    .status-value.small { font-size:16px; line-height:1.4; }
    .status-meta { margin-top:6px; color:var(--text3); font-size:11px; line-height:1.45; }
    .tone-ok { color:var(--accent); }.tone-warn { color:var(--warn); }.tone-bad { color:var(--danger); }
    .control-card { padding:22px; }
    .control-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; }
    .control-head p { margin-top:5px; color:var(--text3); font-size:12px; }
    .live-chip { display:inline-flex; align-items:center; gap:7px; padding:6px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--border); color:var(--text3); font-size:11px; }
    .actions { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:20px; }
    .action {
      min-height:94px; padding:14px; align-items:flex-start; justify-content:flex-start; flex-direction:column;
      border-radius:9px; text-align:left;
    }
    .action strong { font-size:13px; }.action span { color:var(--text3); font-size:11px; font-weight:500; line-height:1.45; white-space:normal; }
    .result {
      margin-top:16px; min-height:46px; padding:12px 14px; display:flex; align-items:flex-start; gap:9px;
      border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); color:var(--text2); font-size:12px; line-height:1.5;
    }
    .result[hidden] { display:none; }
    .result.ok { background:var(--accent-soft); border-color:color-mix(in srgb,var(--accent) 24%,transparent); color:var(--accent-dark); }
    .result.bad { background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 24%,transparent); color:var(--danger); }
    .modal-backdrop { position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:22px; background:rgba(14,18,22,.46); backdrop-filter:blur(5px); }
    .modal-backdrop[hidden] { display:none; }
    .modal { width:min(440px,100%); padding:24px; background:var(--card); border:1px solid var(--border); border-radius:13px; box-shadow:var(--shadow-lg); }
    .modal-badge { width:42px; height:42px; display:grid; place-items:center; border-radius:11px; color:var(--warn); background:var(--warn-soft); }
    .modal.danger .modal-badge { color:var(--danger); background:var(--danger-soft); }
    .modal h3 { margin-top:18px; font-size:19px; }.modal p { margin-top:8px; color:var(--text2); font-size:13px; line-height:1.6; }
    .modal-actions { margin-top:22px; display:flex; justify-content:flex-end; gap:8px; }
    .spinner { width:14px; height:14px; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:820px) {
      .topbar { padding:10px 14px; flex-wrap:wrap; }.brand-copy p,.clock { display:none; }
      main { width:min(100% - 24px,680px); margin-top:20px; }
      .hero { grid-template-columns:1fr; }.status-grid { grid-template-columns:repeat(2,1fr); }.actions { grid-template-columns:repeat(2,1fr); }
      .intro { padding:22px; }.intro h2 { font-size:24px; }
    }
    @media (max-width:480px) {
      .brand-copy h1 { max-width:130px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .toolbar { gap:6px; }.toolbar .btn { width:36px; padding:0; }.toolbar .btn span { display:none; }
      .status-grid { grid-template-columns:1fr 1fr; }.status-card { padding:15px; min-height:112px; }
      .status-value { font-size:18px; }.actions { grid-template-columns:1fr; }
      .input-row { flex-direction:column; }.input-row .btn { width:100%; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
    <symbol id="i-language" viewBox="0 0 24 24"><path d="M5 7h8M9 4v3m-2 0c.5 4 3 6 6 7M6 14c2-.8 4-2.8 5-5M15 20l3-8 3 8m-5-3h4"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2-7 4 14 2-7h6"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><path d="M4 4h16v6H4zM4 14h16v6H4z"/><path d="M8 7h.01M8 17h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5m0 3h.01"/></symbol>
  </svg>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-shield"/></svg></span>
      <div class="brand-copy"><h1 data-t="title">主站控制</h1><p>Digital Human Operations Control</p></div>
    </div>
    <div class="toolbar">
      <span class="clock" id="clock">-</span>
      <a class="btn btn-ghost" href="/ops"><svg class="icon"><use href="#i-back"/></svg><span data-t="back">返回看板</span></a>
      <button class="btn btn-ghost" id="langBtn" type="button"><svg class="icon"><use href="#i-language"/></svg><span id="langText">EN</span></button>
      <button class="btn btn-primary" id="refreshBtn" type="button" disabled><svg class="icon"><use href="#i-refresh"/></svg><span data-t="refresh">檢查狀態</span></button>
    </div>
  </header>

  <main>
    <section class="hero">
      <article class="card intro">
        <div class="eyebrow" data-t="eyebrow">獨立控制面</div>
        <h2 data-t="headline">主站停止後，仍然可以安全地重新啟動。</h2>
        <p data-t="description">這個控制系統獨立於線上主站運行。所有狀態查詢和服務操作都必須通過運維碼驗證。</p>
        <div class="safety-note"><svg class="icon"><use href="#i-lock"/></svg><span data-t="safety">操作只會影響 DigitalHuman 主站服務，不會關閉 EC2 或 nginx。</span></div>
      </article>
      <article class="card auth">
        <div class="card-title"><svg class="icon"><use href="#i-lock"/></svg><span data-t="verifyTitle">驗證運維身份</span></div>
        <div class="field">
          <label for="opsCode" data-t="codeLabel">運維碼</label>
          <div class="input-row">
            <input id="opsCode" type="password" autocomplete="current-password" data-t-placeholder="codePlaceholder" placeholder="輸入運維碼">
            <button class="btn btn-primary" id="verifyBtn" type="button" data-t="verify">驗證</button>
          </div>
        </div>
        <div class="auth-state" id="authState"><span class="dot"></span><span data-t="notVerified">尚未驗證</span></div>
      </article>
    </section>

    <section class="status-grid" aria-live="polite">
      <article class="card status-card"><div class="status-label"><svg class="icon"><use href="#i-server"/></svg><span data-t="service">主站服務</span></div><div class="status-value" id="serviceValue">—</div><div class="status-meta" id="serviceMeta" data-t="locked">驗證後顯示</div></article>
      <article class="card status-card"><div class="status-label"><svg class="icon"><use href="#i-activity"/></svg><span data-t="health">HTTP 健康</span></div><div class="status-value" id="healthValue">—</div><div class="status-meta" id="healthMeta" data-t="locked">驗證後顯示</div></article>
      <article class="card status-card"><div class="status-label"><svg class="icon"><use href="#i-shield"/></svg><span>NGINX</span></div><div class="status-value" id="nginxValue">—</div><div class="status-meta" id="nginxMeta" data-t="locked">驗證後顯示</div></article>
      <article class="card status-card"><div class="status-label"><svg class="icon"><use href="#i-clock"/></svg><span data-t="checked">檢查時間</span></div><div class="status-value small" id="checkedValue">—</div><div class="status-meta">UTC+8</div></article>
    </section>

    <section class="card control-card">
      <div class="control-head">
        <div><div class="card-title" data-t="controls">主站操作</div><p data-t="controlsHint">高風險操作會要求二次確認，伺服器也會再次驗證運維碼。</p></div>
        <div class="live-chip"><span class="dot"></span><span data-t="controllerOnline">控制服務在線</span></div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost action" type="button" data-action="check" disabled><svg class="icon"><use href="#i-activity"/></svg><strong data-t="checkHealth">Check health</strong><span data-t="checkDesc">重新讀取主站與 HTTP 狀態</span></button>
        <button class="btn btn-primary action" type="button" data-action="start" disabled><svg class="icon"><use href="#i-play"/></svg><strong data-t="start">啟動主站</strong><span data-t="startDesc">在主站停止時重新啟動服務</span></button>
        <button class="btn btn-warn action" type="button" data-action="restart" disabled><svg class="icon"><use href="#i-restart"/></svg><strong data-t="restart">重啟主站</strong><span data-t="restartDesc">短暫中斷後重新載入主站</span></button>
        <button class="btn btn-danger action" type="button" data-action="stop" disabled><svg class="icon"><use href="#i-stop"/></svg><strong data-t="stop">關閉主站</strong><span data-t="stopDesc">停止主站，控制頁仍保持可用</span></button>
      </div>
      <div class="result" id="result" hidden></div>
    </section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-badge"><svg class="icon"><use href="#i-alert"/></svg></div>
      <h3 id="modalTitle">—</h3><p id="modalText">—</p>
      <div class="modal-actions"><button class="btn btn-ghost" id="cancelBtn" type="button" data-t="cancel">取消</button><button class="btn btn-warn" id="confirmBtn" type="button" data-t="confirm">確認執行</button></div>
    </div>
  </div>

  <script>
    const T = {
      zh:{title:'主站控制',back:'返回看板',refresh:'檢查狀態',eyebrow:'獨立控制面',headline:'主站停止後，仍然可以安全地重新啟動。',description:'這個控制系統獨立於線上主站運行。所有狀態查詢和服務操作都必須通過運維碼驗證。',safety:'操作只會影響 DigitalHuman 主站服務，不會關閉 EC2 或 nginx。',verifyTitle:'驗證運維身份',codeLabel:'運維碼',codePlaceholder:'輸入運維碼',verify:'驗證',notVerified:'尚未驗證',verified:'已驗證：{name}',invalid:'運維碼錯誤',service:'主站服務',health:'HTTP 健康',checked:'檢查時間',locked:'驗證後顯示',controls:'主站操作',controlsHint:'高風險操作會要求二次確認，伺服器也會再次驗證運維碼。',controllerOnline:'控制服務在線',checkHealth:'Check health',checkDesc:'重新讀取主站與 HTTP 狀態',start:'啟動主站',startDesc:'在主站停止時重新啟動服務',restart:'重啟主站',restartDesc:'短暫中斷後重新載入主站',stop:'關閉主站',stopDesc:'停止主站，控制頁仍保持可用',cancel:'取消',confirm:'確認執行',running:'運行中',stopped:'已停止',healthy:'正常',offline:'離線',enabled:'開機自啟',pid:'PID {value}',response:'{value} ms',authFirst:'請先驗證運維碼。',checking:'正在檢查主站狀態…',statusDone:'健康檢查完成：{state}',actionDone:'{action}完成，最新狀態：{state}',actionFailed:'操作失敗，請檢查控制服務日誌。',confirmStart:'確認啟動主站？',confirmRestart:'確認重啟主站？',confirmStop:'確認關閉主站？',confirmStartText:'主站服務將被啟動，恢復公開訪問。',confirmRestartText:'主站會短暫中斷，控制頁不受影響。',confirmStopText:'主站將停止並暫時無法訪問；此控制頁仍可用於重新啟動。'},
      en:{title:'Main Site Control',back:'Back to Dashboard',refresh:'Check Status',eyebrow:'Independent control plane',headline:'Recover the main site safely, even after it has stopped.',description:'This control system runs independently from the public site. Every status query and service action requires a valid ops code.',safety:'Actions affect only the DigitalHuman main service. They do not shut down EC2 or nginx.',verifyTitle:'Verify operator identity',codeLabel:'Ops code',codePlaceholder:'Enter ops code',verify:'Verify',notVerified:'Not verified',verified:'Verified: {name}',invalid:'Invalid ops code',service:'Main service',health:'HTTP health',checked:'Checked at',locked:'Visible after verification',controls:'Main site actions',controlsHint:'Risky actions require confirmation and the server verifies the ops code again.',controllerOnline:'Control service online',checkHealth:'Check health',checkDesc:'Refresh the service and HTTP state',start:'Start site',startDesc:'Start the service when the site is offline',restart:'Restart site',restartDesc:'Reload the site after a brief interruption',stop:'Stop site',stopDesc:'Stop the site while keeping control available',cancel:'Cancel',confirm:'Confirm action',running:'Running',stopped:'Stopped',healthy:'Healthy',offline:'Offline',enabled:'Starts on boot',pid:'PID {value}',response:'{value} ms',authFirst:'Verify the ops code first.',checking:'Checking main-site status…',statusDone:'Health check complete: {state}',actionDone:'{action} complete. Current state: {state}',actionFailed:'Action failed. Check the control service log.',confirmStart:'Start the main site?',confirmRestart:'Restart the main site?',confirmStop:'Stop the main site?',confirmStartText:'The public main-site service will be started.',confirmRestartText:'The site will be briefly unavailable. This control page stays online.',confirmStopText:'The public site will go offline. This control page remains available to start it again.'}
    };
    let lang = localStorage.getItem('opsLang') || 'zh';
    let authenticated = false, operator = '', pendingAction = '', verifiedCode = '';
    const $ = id => document.getElementById(id);
    const tr = (key, vars={}) => Object.entries(vars).reduce((s,[k,v]) => s.replace(`{${k}}`,v), T[lang][key] || key);
    function applyLang(){document.documentElement.lang=lang==='en'?'en':'zh-HK';document.querySelectorAll('[data-t]').forEach(el=>el.textContent=tr(el.dataset.t));document.querySelectorAll('[data-t-placeholder]').forEach(el=>el.placeholder=tr(el.dataset.tPlaceholder));$('langText').textContent=lang==='en'?'中':'EN';document.title=tr('title')+' · Digital Human';if(authenticated)setAuth('ok',tr('verified',{name:operator}));}
    function setAuth(kind,text){$('authState').className='auth-state '+kind;$('authState').innerHTML='<span class="dot"></span><span></span>';$('authState').lastElementChild.textContent=text;}
    function code(){return verifiedCode || $('opsCode').value.trim();}
    function headers(){return {'X-User-Code':code()};}
    async function api(path,options={}){const response=await fetch(path,{cache:'no-store',...options,headers:{...(options.headers||{}),...headers()}});let data={};try{data=await response.json();}catch{}if(!response.ok){const error=new Error(data.detail||`HTTP ${response.status}`);error.status=response.status;throw error;}return data;}
    function setActions(enabled){document.querySelectorAll('[data-action]').forEach(btn=>btn.disabled=!enabled);$('refreshBtn').disabled=!enabled;}
    function tone(el,state){el.classList.remove('tone-ok','tone-warn','tone-bad');el.classList.add(state==='ok'?'tone-ok':state==='warn'?'tone-warn':'tone-bad');}
    function renderStatus(data){const svc=data.service||{},health=data.health||{},nginx=data.nginx||{};$('serviceValue').textContent=svc.active?tr('running'):tr('stopped');tone($('serviceValue'),svc.active?'ok':'bad');$('serviceMeta').textContent=svc.active?`${tr('pid',{value:svc.main_pid})} · ${tr('enabled')}`:svc.sub_state||'inactive';$('healthValue').textContent=health.reachable?tr('healthy'):tr('offline');tone($('healthValue'),health.reachable?'ok':'bad');$('healthMeta').textContent=health.reachable?tr('response',{value:health.response_ms}):(health.status_code?`HTTP ${health.status_code}`:'No response');$('nginxValue').textContent=nginx.active?tr('running'):tr('offline');tone($('nginxValue'),nginx.active?'ok':'bad');$('nginxMeta').textContent=nginx.active?(nginx.sub_state||'running'):(nginx.active_state||'inactive');const when=new Date(data.checked_at);$('checkedValue').textContent=Number.isNaN(when.getTime())?'—':when.toLocaleTimeString(lang==='en'?'en-US':'zh-HK',{hour12:false,timeZone:'Asia/Hong_Kong'});document.querySelector('[data-action="start"]').disabled=!authenticated||svc.active;document.querySelector('[data-action="stop"]').disabled=!authenticated||!svc.active;document.querySelector('[data-action="restart"]').disabled=!authenticated||!svc.active;}
    function showResult(kind,text,loading=false){$('result').hidden=false;$('result').className='result '+kind;$('result').innerHTML=loading?'<span class="spinner"></span><span></span>':'<span></span>';$('result').lastElementChild.textContent=text;}
    async function verify(){const candidate=$('opsCode').value.trim();if(!candidate&&!verifiedCode){setAuth('bad',tr('authFirst'));return;}setAuth('',tr('checking'));try{verifiedCode=candidate||verifiedCode;const data=await api('/api/control/verify',{method:'POST'});authenticated=true;operator=data.operator||'';$('opsCode').value='';setAuth('ok',tr('verified',{name:operator}));setActions(true);await refreshStatus(false);}catch(error){authenticated=false;operator='';verifiedCode='';$('opsCode').value='';setActions(false);setAuth('bad',error.status===401?tr('invalid'):tr('actionFailed'));}}
    async function refreshStatus(announce=true){if(!authenticated){showResult('bad',tr('authFirst'));return;}if(announce)showResult('',tr('checking'),true);try{const data=await api('/api/control/status');renderStatus(data);if(announce)showResult('ok',tr('statusDone',{state:data.overall==='healthy'?tr('healthy'):tr('offline')}));}catch(error){if(error.status===401){authenticated=false;verifiedCode='';setActions(false);setAuth('bad',tr('invalid'));}showResult('bad',tr('actionFailed'));}}
    function openConfirm(action){pendingAction=action;const modal=$('modal').firstElementChild;modal.classList.toggle('danger',action==='stop');$('modalTitle').textContent=tr('confirm'+action[0].toUpperCase()+action.slice(1));$('modalText').textContent=tr('confirm'+action[0].toUpperCase()+action.slice(1)+'Text');$('confirmBtn').className='btn '+(action==='stop'?'btn-danger':'btn-warn');$('modal').hidden=false;$('confirmBtn').focus();}
    function closeConfirm(){$('modal').hidden=true;pendingAction='';}
    async function execute(){const action=pendingAction;closeConfirm();setActions(false);showResult('',tr('checking'),true);try{const data=await api('/api/control/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});authenticated=true;setActions(true);renderStatus(data.status);showResult('ok',tr('actionDone',{action:tr(action),state:data.status.overall==='healthy'?tr('healthy'):tr('offline')}));}catch(error){setActions(authenticated);showResult('bad',tr('actionFailed'));}}
    $('verifyBtn').addEventListener('click',verify);$('opsCode').addEventListener('keydown',e=>{if(e.key==='Enter')verify();});$('refreshBtn').addEventListener('click',()=>refreshStatus(true));$('langBtn').addEventListener('click',()=>{lang=lang==='en'?'zh':'en';localStorage.setItem('opsLang',lang);applyLang();if(authenticated)refreshStatus(false);});document.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>btn.dataset.action==='check'?refreshStatus(true):openConfirm(btn.dataset.action)));$('cancelBtn').addEventListener('click',closeConfirm);$('confirmBtn').addEventListener('click',execute);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeConfirm();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConfirm();});
    function tick(){$('clock').textContent=new Date().toLocaleTimeString(lang==='en'?'en-US':'zh-HK',{hour12:false,timeZone:'Asia/Hong_Kong'})+' UTC+8';}setInterval(tick,1000);setInterval(()=>{if(authenticated)refreshStatus(false);},15000);
    applyLang();tick();
  </script>
</body>
</html>
