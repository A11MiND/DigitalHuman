<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理員登入 — 數字人殿堂</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚙️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    color-scheme: light;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #353740;
    --text2: #6e6e80;
    --text3: #8e8ea0;
    --border: #e5e5e6;
    --accent: #10a37f;
    --accent-dark: #0d9168;
    --accent-light: #e6f7f2;
    --accent-ring: rgba(16,163,127,.14);
    --red: #e53e3e;
    --red-light: #fdecec;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
  }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px 26px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.05);
  }

  .brand { text-align: center; margin-bottom: 26px; }
  .mark {
    width: 40px; height: 40px;
    margin: 0 auto 14px;
    border-radius: 10px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .mark svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.8; }
  .brand h1 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .brand p { font-size: 12px; color: var(--text3); letter-spacing: .4px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
  .field input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--bg);
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    border-color: var(--accent);
    background: var(--card);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }

  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 8px; font-size: 14px; cursor: pointer; opacity: .5;
  }
  .pw-toggle:hover { opacity: .85; }

  .btn-primary {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: none;
    border-radius: 9px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-dark); }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }

  .msg {
    display: none;
    padding: 10px 12px;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.5;
    margin-bottom: 14px;
  }
  .msg.show { display: block; }
  .msg.error { background: var(--red-light); color: #b3251f; border: 1px solid rgba(229,62,62,.22); }
  .msg.ok { background: var(--accent-light); color: var(--accent-dark); border: 1px solid var(--accent-ring); }

  .foot {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    text-align: center;
  }
  .foot a { font-size: 12.5px; color: var(--text3); text-decoration: none; }
  .foot a:hover { color: var(--accent-dark); }

  .spin {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .6s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></div>
    <h1>管理平台登入</h1>
    <p>DIGITAL HUMAN · CONSOLE</p>
  </div>

  <div class="msg" id="msg"></div>

  <form id="loginForm" autocomplete="on">
    <div class="field">
      <label for="username">帳號</label>
      <input type="text" id="username" name="username" placeholder="管理員帳號"
             autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="password">密碼</label>
      <div class="pw-wrap">
        <input type="password" id="password" name="password" placeholder="請輸入密碼"
               autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="顯示密碼">👁</button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">登入管理平台</button>
  </form>

  <div class="foot">
    <a href="/login.html">不是管理員？前往數字人殿堂</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const msgEl = $('msg');
function showMsg(text, kind = 'error') { msgEl.textContent = text; msgEl.className = `msg show ${kind}`; }
function clearMsg() { msgEl.className = 'msg'; }

// 已是管理员会话就直接进后台；非管理员会话留在此页，不代它跳转到消费端
(async function checkExisting() {
  let token = '';
  try { token = localStorage.getItem('dh_session_token') || ''; } catch (_) {}
  if (!token) return;
  try {
    const r = await fetch('/api/auth/session', { headers: { 'X-Session-Token': token } });
    const d = await r.json();
    if (d.authenticated && d.role === 'admin') location.replace('/ops.html');
  } catch (_) {}
})();

$('pwToggle').addEventListener('click', () => {
  const pw = $('password');
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  $('pwToggle').textContent = show ? '🙈' : '👁';
  pw.focus();
});

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  clearMsg();
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { showMsg('請填寫帳號和密碼'); return; }

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>登入中';

  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const d = await r.json();

    if (!r.ok) {
      showMsg(typeof d.detail === 'string' ? d.detail : '登入失敗，請重試');
      btn.disabled = false; btn.textContent = '登入管理平台';
      return;
    }

    // 管理平台只認管理員帳戶——就算密碼正確，非管理員也不放行，並登出剛建立的會話
    if (d.role !== 'admin') {
      try {
        await fetch('/api/auth/logout', { method: 'POST', headers: { 'X-Session-Token': d.token } });
      } catch (_) {}
      showMsg('此帳戶不是管理員帳戶，請前往「數字人殿堂」登入');
      btn.disabled = false; btn.textContent = '登入管理平台';
      return;
    }

    try {
      localStorage.setItem('dh_session_token', d.token);
      localStorage.setItem('dh_session_user', JSON.stringify({
        username: d.username, display_name: d.display_name, role: d.role, features: d.features
      }));
    } catch (_) {}

    showMsg(`歡迎回來，${d.display_name}`, 'ok');
    setTimeout(() => location.replace('/ops.html'), 400);

  } catch (err) {
    showMsg('無法連接伺服器，請檢查網絡');
    btn.disabled = false; btn.textContent = '登入管理平台';
  }
});

$('username').focus();
</script>

</body>
</html>
